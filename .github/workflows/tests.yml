name: Tests

on:
  push:
    branches: [ main, '*' ]
  pull_request:
    branches: [ main, '*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
        pip install -e ".[reports]"

    - name: S3 cost budgets (idle and history x10)
      env:
        PYTHONPATH: .
        AWS_EC2_METADATA_DISABLED: 'true'
      run: python -m pytest tests/cost -q --junitxml=s3-cost-results.xml -o junit_family=legacy

    - name: Upload S3 cost results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: s3-cost-results
        path: s3-cost-results.xml
        if-no-files-found: error

    - name: Run tests
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --ignore=tests/cost
