# Include inside an existing TLS server block with a valid public certificate.
location = /xtrek/s3-events {
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_pass http://127.0.0.1:18981;
    proxy_set_header Host $host;
    proxy_set_header X-Xtrek-Timestamp $http_x_xtrek_timestamp;
    proxy_set_header X-Xtrek-Signature $http_x_xtrek_signature;
}
